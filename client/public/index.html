<!DOCTYPE html>
<html lang="en">
  <head>
  <script>if ('%NODE_ENV%' === 'development') document.write('<script src="//unpkg.com/devknobs/dist/early.global.js"><\/script>');</script>
  <meta charset="utf-8" />
  
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Opaque status bar on purpose. With "black-translucent" + viewport-fit=cover,
       iOS 26 Home Screen apps get a web view one status-bar height too short
       (WebKit bug 301108): a blank strip under the bottom nav, plus a blurred
       status bar over the header. "default" lets iOS draw its own solid bar
       and run the app to the real bottom edge. Installed apps only pick this
       up after being removed and re-added to the Home Screen. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VenkyArt">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  
  <!-- Status/toolbar colour: white to match the app's white headers (and keep the
       opaque iOS status bar's dark icons readable); navy when the phone is in dark mode. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
  
  <meta name="description" content="Venky Art Academy Portal" />
  <title>Thevenkyart Art Academy</title>
</head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
